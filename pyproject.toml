[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-roadmap"
version = "0.2.0"
description = "A production-grade, hands-on curriculum for building agentic AI systems with LangGraph, MCP, and A2A."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Adil Shamim" }]
keywords = ["agentic-ai", "langgraph", "mcp", "a2a", "agents", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "langgraph==1.2.16",
    "langchain==1.4.6",
    "langchain-core==1.6.12",
    "langchain-openai==1.7.2",
    "langchain-anthropic==1.7.6",
    "langchain-mcp-adapters==0.3.2",
    "langgraph-checkpoint-sqlite==3.1.2",
    "langgraph-checkpoint-postgres==3.2.0",
    "langsmith==0.14.11",
    # mcp: the 1.x line is what langchain-mcp-adapters currently requires;
    # it speaks protocol revision 2025-11-25. The 2.x SDK line (stateless,
    # 2026-07-28 revision) is tracked separately.
    "mcp==1.30.0",
    "pydantic==2.14.1",
    "httpx==0.28.1",
    "rich==15.0.0",
    "tenacity==9.2.1",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "nbqa==1.9.1",
    "jupyterlab==4.6.4",
]
deploy = [
    "langgraph-cli==0.4.36",
    "fastapi==0.146.0",
    "uvicorn==0.54.0",
    "psycopg[binary]==3.3.6",
    "redis==8.1.0",
]

[project.urls]
Homepage = "https://github.com/AdilShamim8/Agentic-AI-Roadmap-with-Notes-and-Projects"
Repository = "https://github.com/AdilShamim8/Agentic-AI-Roadmap-with-Notes-and-Projects"
Changelog = "https://github.com/AdilShamim8/Agentic-AI-Roadmap-with-Notes-and-Projects/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["examples"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["examples", "tests"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
